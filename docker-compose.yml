services:

  postgres:
    image: postgres:16
    container_name: taskflow-postgres

    restart: always

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7

    container_name: taskflow-redis

    restart: always

    ports:
      - "6379:6379"

  backend:
    build: ./backend

    container_name: taskflow-backend

    ports:
      - "4000:4000"

    volumes:
      - ./backend:/app

    depends_on:
      - postgres
      - redis

    env_file:
      - .env

  frontend:
    build: ./frontend

    container_name: taskflow-frontend

    ports:
      - "3000:3000"

    volumes:
      - ./frontend:/app

    depends_on:
      - backend

volumes:
  postgres_data: